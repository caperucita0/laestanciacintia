<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LA ESTANCIA</title>
  <link rel="icon" href="la estan.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #800000; /* Corinto */
      color: white;
      text-align: center;
    }

    header {
      padding: 30px 0;
      animation: fadeInDown 1.5s ease;
    }

    img {
      width: 300px;
      height: 300px;
      object-fit: cover;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
    }

    img:hover {
      transform: scale(1.05);
    }

    h1 {
      font-size: 2.5em;
      margin-top: 20px;
    }

    hr {
      width: 80%;
      margin: 20px auto;
      border: 1px solid white;
    }

    a {
      display: inline-block;
      background-color: rgb(25, 75, 58);
      color: #800000;
      padding: 12px 25px;
      margin: 15px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
      transition: background-color 0.3s, transform 0.3s;
    }

    a:hover {
      background-color: #7a1b1b;
      transform: scale(1.05);
    }

    /* Estilo para los iconos */
    .social-icons {
      margin-top: 40px;
    }

    .social-icons a {
      font-size: 35px;
      margin: 10px;
      color: rgb(8, 8, 8);
      transition: transform 0.3s, color 0.3s;
    }

    .social-icons a:hover {
      transform: scale(1.1);
      color: #d61010;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
