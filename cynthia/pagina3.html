<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LA ESTANCIA</title>
  <link rel="icon" href="la estan.png">
  <style>
    body {
      background-color: #800000;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 30px;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px #ffffff;
    }

    hr {
      border: 1px solid white;
      width: 60%;
      margin: 20px auto;
    }

    .seccion {
      background-color: rgba(255, 255, 255, 0.15);
      border: 3px solid white;
      border-radius: 25px;
      padding: 30px;
      margin: 50px auto;
      width: 90%;
      max-width: 1000px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
      animation: fadeInUp 1s ease;
      position: relative;
    }

    .silueta {
      width: 60px;
      height: 60px;
      fill: white;
      margin: 0 auto 10px;
      animation: flotar 2s infinite ease-in-out;
    }

    .galeria {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .galeria img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 25px;
      border: 4px solid white;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .galeria img:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 20px rgba(255, 255, 255, 0.5);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes flotar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <h1>NUESTRO MENÚ</h1>
  <hr><br><br>

  <div class="seccion">
    <!-- Silueta de comida (plato con cubiertos) -->
    <svg class="silueta" viewBox="0 0 24 24">
      <path d="M4 2h2v20H4V2zm5.5 0h2v9.5c0 1.5 1.5 2 1.5 2s1.5-.5 1.5-2V2h2v9.5c0 1.5 1.5 2 1.5 2s1.5-.5 1.5-2V2h2v9.5c0 3-3 4.5-3 4.5V22h-2v-6h-2v6h-2v-6s-3-1.5-3-4.5V2z"/>
    </svg>
    <h1>COMIDAS</h1>
    <hr>
    <div class="galeria">
      <img src="comida1.jpg" alt="Comida 1">
      <img src="comida2.jpg" alt="Comida 2">
      <img src="comida3.jpg" alt="Comida 3">
      <img src="comida4.jpg" alt="Comida 4">
      <img src="comida5.jpg" alt="Comida 5">
      <img src="comida6.jpg" alt="Comida 6">
      <img src="comida7.jpg" alt="Comida 7">
      <img src="comida8.jpg" alt="Comida 8">
      <img src="comida9.jpg" alt="Comida 9">
    </div>
  </div>

  <div class="seccion">
    <!-- Silueta de bebida (copa de cocktail) -->
    <svg class="silueta" viewBox="0 0 24 24">
      <path d="M7 2h10l-5 6-5-6zm5 7l5.1 5.7c.6.7.9 1.5.9 2.3 0 2.2-1.8 4-4 4s-4-1.8-4-4c0-.8.3-1.6.9-2.3L12 9z"/>
    </svg>
    <h1>BEBIDAS</h1>
    <hr>
    <div class="galeria">
      <img src="bebida1.jpg" alt="Bebida 1">
      <img src="bebida2.jpg" alt="Bebida 2">
      <img src="bebida3.jpg" alt="Bebida 3">
    </div>
  </div>

</body>
</html>
